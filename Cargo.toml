[package]
name = "tracciadoc"
version = "0.2.9"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[[bin]]
name = "TracciaDoc"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
regex = "1"
zip = { version = "7", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "image_025"] }
libloading = "0.9"
tempfile = "3"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 8
