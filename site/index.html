<style>
@font-face{font-family:"Titillium Web";font-weight:400;src:url(fonts/TitilliumWeb-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Titillium Web";font-weight:600;src:url(fonts/TitilliumWeb-SemiBold.ttf) format("truetype");font-display:swap}
:root{--bg:#14161A;--bg2:#1A1D21;--surf:#23272D;--bd:#363C44;--tx:#ECEFF2;--tx2:#9AA4AD;--pri:#12806F;--pri2:#129680;--acc:#3ECFB2;--warn:#F2B84B;--navy:#001A4D;--cur:#F2C230}
:root[data-theme=light]{--bg:#F6F8FA;--bg2:#FFFFFF;--surf:#FFFFFF;--bd:#D8DEE4;--tx:#14161A;--tx2:#58626C;--pri:#0E6E5F;--pri2:#12806F;--acc:#0E8A76;--warn:#9A6400}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 18px/1.6 "Titillium Web",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;color:var(--tx);text-decoration:none}
.brand img{width:34px;height:34px;border-radius:8px}
nav .links{margin-left:auto;display:flex;gap:22px;align-items:center}
nav .links a{color:var(--tx2);text-decoration:none;font-size:16px}
nav .links a:hover{color:var(--tx)}
.ctl{display:flex;gap:8px}
.ctl button{background:var(--surf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;height:34px;min-width:38px;padding:0 10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.hero{position:relative;overflow:hidden;padding:84px 0 64px;background:radial-gradient(900px 420px at 85% 10%,color-mix(in srgb,var(--pri) 38%,transparent),transparent 70%),var(--bg)}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero img.icon{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px #0006}
h1{font-size:clamp(40px,6vw,68px);line-height:1.05;margin:18px 0 10px;font-weight:600;letter-spacing:-.5px}
.tag{font-size:clamp(22px,3vw,30px);color:var(--acc);font-weight:600;margin:0 0 16px}
.lead{color:var(--tx2);max-width:34em;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 24px;border-radius:10px;font-weight:600;font-size:17px;text-decoration:none;border:1px solid var(--bd);color:var(--tx);background:var(--surf)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.meta{margin-top:14px;font-size:14px;color:var(--tx2)}
.shot{border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px #0006;background:var(--surf)}
.shot img{display:block;width:100%;height:auto}
section{padding:72px 0}
section.alt{background:var(--bg2);border-block:1px solid var(--bd)}
h2{font-size:clamp(28px,4vw,40px);margin:0 0 12px;font-weight:600}
.sub{color:var(--tx2);max-width:40em;margin:0 0 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:22px}
.card h3{margin:10px 0 6px;font-size:20px;font-weight:600}
.card p{margin:0;color:var(--tx2);font-size:16px;line-height:1.5}
.ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:600;font-size:18px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{position:relative;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:22px 22px 22px 22px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;font-weight:600;margin-bottom:12px}
.step h3{margin:0 0 6px;font-size:20px;font-weight:600}
.step p{margin:0;color:var(--tx2);font-size:16px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.two ul{padding-left:20px;margin:0;color:var(--tx2)}
.two li{margin:8px 0}
.two li b{color:var(--tx)}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:14px 18px;border-radius:0 10px 10px 0;color:var(--tx);font-size:16px;margin-top:24px}
.doc{max-width:380px;margin:0 auto}
pre,code{font-family:ui-monospace,Consolas,monospace;font-size:14px}
code{background:var(--surf);border:1px solid var(--bd);padding:1px 6px;border-radius:5px}
.dl{text-align:center}
.dl .sub{margin-inline:auto}
.dl .cta{justify-content:center}
footer{padding:36px 0;border-top:1px solid var(--bd);color:var(--tx2);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer img{height:22px;opacity:.9}
:root[data-theme=light] footer img{filter:invert(1)}
[lang=en] .it,[lang=it] .en{display:none}
@media(max-width:860px){.hero .grid,.two{grid-template-columns:1fr}.hero{padding-top:48px}nav .links a.hide{display:none}}
</style>
</head>

<script>
const T={
it:{nav1:"Come funziona",nav2:"L'app",
tag:"Trova, rivedi, elimina, verifica.",

uiT:"Interfaccia chiara, tema scuro e chiaro",u1:"Schede dei dischi con spazio occupato",u2:"Avanzamento per fasi durante la scansione",u3:"Filtri e pannello di dettaglio in revisione",u4:"Confronto prima/dopo nella verifica finale",

getT:"Scaricalo",getS:"Zip con eseguibile e checksum SHA-256 nelle release di GitHub.",
man:"Istruzioni",val:"Validazione e limiti",

en:{nav1:"How it works",nav2:"The app",
tag:"Find, review, delete, verify.",
lead:"A Windows 10/11 app that scans disks for forgotten copies of identity documents (ID card, driving licence, passport, health card) and ID-style photos, lets you delete them in a click and produces a PDF report.",
dl:"Download for Windows x64",src:"Source on GitHub",
meta:"Free · Open source (MIT) · Windows 10/11 · No installation required",
whyT:"Built for anyone handling paperwork with ID documents",
whyS:"When an office issues documents, scans end up in Downloads, Documents or on the Desktop and stay there. TracciaDoc finds them.",

const root=document.documentElement;
function setLang(l){root.lang=l;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);
 bIt.setAttribute("aria-pressed",l==="it");bEn.setAttribute("aria-pressed",l==="en");
 document.title=l==="it"?"TracciaDoc – Trova le copie dei documenti d'identità":"TracciaDoc – Find leftover ID document copies";
 try{localStorage.setItem("lang",l)}catch(e){}}
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}}
bIt.onclick=()=>setLang("it");bEn.onclick=()=>setLang("en");
bTh.onclick=()=>setTheme(root.dataset.theme==="light"?"dark":"light");
let l=null,t=null;try{l=localStorage.getItem("lang");t=localStorage.getItem("theme")}catch(e){}
setLang(l||((navigator.language||"it").toLowerCase().startsWith("it")?"it":"en"));
setTheme(t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
